<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" role="img" aria-label="Alamz Tech">
  <!-- Icon-only mark for the 19px header slot and the 16px favicon.
       Derived from the founder's badge: same square brass frame, but the
       "ALAMZ TECH" lettering is replaced by a single bold A. The full badge
       cannot be used at these sizes — its wordmark is illegible below about
       48px, and in the header it would repeat the wordmark text sitting
       right beside it. Use assets/logo-badge.svg wherever the mark is large.
       currentColor so the theme toggle recolours it. -->
  <rect x="2" y="2" width="20" height="20" stroke="currentColor" stroke-width="2"/>
  <path d="M8.2 17.2 12 6.9l3.8 10.3M9.7 14.1h4.6"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
