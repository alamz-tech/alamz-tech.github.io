<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- Same mark as assets/logo.svg. Brass is hardcoded here rather than
       currentColor: a favicon renders in browser chrome with no CSS context,
       so it cannot inherit a colour. #C6851C is legible on both light and
       dark tab bars. Keep this in sync with assets/logo.svg by hand. -->
  <rect x="2" y="2" width="20" height="20" stroke="#C6851C" stroke-width="2"/>
  <path d="M8.2 17.2 12 6.9l3.8 10.3M9.7 14.1h4.6"
        stroke="#C6851C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
